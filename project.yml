---
:project:
  :which_ceedling: gem
  :ceedling_version: 1.0.1
  :use_mocks: TRUE
  :use_test_preprocessor: :none
  :use_deep_preprocessor: :none
  :use_backtrace: :simple
  :use_decorators: :auto
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all          # <-- en lista multilínea (no inline)
  :test_threads: 8
  :compile_threads: 8

:plugins:
  :enabled:
    - module_generator
    - gcov
    - report_tests_log_factory
    - report_tests_pretty_stdout

:report_tests_log_factory:
  :report_path: build/artifacts/test
  :reports:
    - json
    - junit
    - cppunit
    - html

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - inc
    - ports
  :support:
    - test/support
  :libraries: []

:defines:
  :test:
    - TEST

:gcov:
  :summaries: TRUE
  :report_task: FALSE
  :utilities:
    - gcovr
  :reports:
    - HtmlBasic
    - Cobertura
  :gcovr:
    :html_medium_threshold: 75
    :html_high_threshold: 90
    :xml: true
    :xml_filename: build/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
:tools:
  :gcovr:
    :executable: python
    :name: gcovr
    :arguments:
      - -m
      - gcovr
