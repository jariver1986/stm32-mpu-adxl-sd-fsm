repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(Drivers/|Middlewares/|FATFS/)  # <-- excluye terceros
      - id: trailing-whitespace
        exclude: ^(Drivers/|Middlewares/|FATFS/)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        files: ^(Core/|App/|Inc/|Src/).*\.([ch]|cpp|hpp)$
        exclude: ^(Drivers/|Middlewares/|FATFS/)  # <-- excluye terceros
