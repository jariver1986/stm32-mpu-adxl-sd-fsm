name: Validations

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Python (para pre-commit y gcovr si luego lo usamos) ---
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # --- Ruby (para Ceedling) ---
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # --- Formato (pre-commit) ---
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files

      # === A partir del próximo paso agregaremos pruebas con Ceedling ===
      # (estas líneas quedarán listas; no fallarán si aún no agregas project.yml)
      - name: Install Ceedling
        run: gem install ceedling
      - name: Install gcovr
        run: python -m pip install gcovr

      # Si ya existe project.yml y tests, ejecutará cobertura; si no, ignora el error
      - name: Run Unit Tests with Coverage (if project.yml exists)
        run: |
          if [ -f project.yml ] || [ -f project.yaml ]; then
            ceedling clobber gcov:all
          else
            echo "No project.yml yet; skipping Ceedling."
          fi

      # Artefactos y reportes (se crean solo si hubo build de Ceedling)
      - name: Upload Ceedling artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceedling-artifacts
          path: build/artifacts/**/*
          if-no-files-found: warn

      - name: Test Results Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Ceedling Unit Tests
          path: build/**/junit*_report.xml
          reporter: java-junit

      - name: Code Coverage Summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/artifacts/gcov/gcovr/GcovCoverageCobertura.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "75 90"

      - name: Output to Job Summary
        if: always()
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage file not generated (no Ceedling yet)." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
